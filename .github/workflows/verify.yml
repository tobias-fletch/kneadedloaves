name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bakery_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kneaded_loaves_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bakery_test:test-only-password@localhost:5432/kneaded_loaves_test?schema=public
      APP_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      JWT_SECRET: ci-only-secret-never-use-in-production-2026
      BAKERY_INTEGRATION_TESTS: "1"
      CHECKOUT_ENABLED: "false"
      CONFIG_ENCRYPTION_KEY: "0101010101010101010101010101010101010101010101010101010101010101"
      STRIPE_SECRET_KEY: sk_test_synthetic_bakery_qa_only
      STRIPE_TEST_MODE: "true"
      STRIPE_WEBHOOK_SECRET: whsec_synthetic_bakery_qa_only
      PAYPAL_WEBHOOK_ID: qa-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm run audit:dependencies
      - run: npm run build
      - name: Migration preservation and replay
        run: bash tests/integration-qa/migration-preservation.sh
      - name: Integration tests
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/bakery-test.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail http://127.0.0.1:3001/api/health && break
            sleep 2
          done
          node --import tsx tests/integration.ts
          node tests/integration-qa/webhook-http.mjs
          node --import tsx tests/integration-qa/extended.mjs
