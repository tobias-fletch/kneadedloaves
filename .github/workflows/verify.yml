name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bakery_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kneaded_loaves_test
        ports: ["5432:5432", "55499:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bakery_test:test-only-password@127.0.0.1:5432/kneaded_loaves_test?schema=public
      APP_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      TEST_APP_URL: http://127.0.0.1:3001
      JWT_SECRET: ci-only-secret-never-use-in-production-2026
      STRIPE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - name: Production build guard integration
        env:
          BUILD_GUARD_TEST_DATABASE_URL: postgresql://bakery_test:test-only-password@127.0.0.1:55499/postgres
        run: node tests/build-guard.integration.mjs
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run build:runtime
      - run: npm run prisma:deploy
      - name: Integration tests
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/bakery-test.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail http://127.0.0.1:3001/api/health && break
            sleep 2
          done
          npm run test:integration
