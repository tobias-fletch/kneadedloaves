[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js is handled by Netlify's maintained OpenNext adapter.
# Never put credentials here or run database migrations during every build.
# The owner must remain on the Free plan with paid top-ups disabled.
[context.deploy-preview.environment]
  CHECKOUT_ENABLED = "false"

[context.branch-deploy.environment]
  CHECKOUT_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["node_modules/.prisma/client/**"]
